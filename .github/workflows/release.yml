name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# No pull_request trigger: the write token is only ever exposed to code the
# maintainer has tagged, never to untrusted PR contributions.
permissions:
  contents: read

jobs:
  deb:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # scoped to this job: create release + upload asset
    steps:
      # Action refs are float tags; Dependabot (.github/dependabot.yml) tracks
      # them. Pin to commit SHAs if you want to remove that trust entirely.
      - uses: actions/checkout@v4

      - name: Check version matches tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          file_ver="$(tr -d ' \t\n\r' < VERSION)"
          tag_ver="${GITHUB_REF_NAME#v}"
          test "$file_ver" = "$tag_ver" || {
            echo "VERSION ($file_ver) != tag ($tag_ver)"; exit 1; }

      - name: Build .deb
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev lintian
          ./build-deb.sh

      - uses: actions/upload-artifact@v7
        with:
          name: codenotch-deb
          path: dist/*.deb

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.deb
          generate_release_notes: true
